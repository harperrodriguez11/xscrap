name: X URL Scraper

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Page to scrape (home timeline, a profile, a search, etc.)"
        required: false
        default: "https://x.com/home"
      max_urls:
        description: "Max total URLs to collect"
        required: false
        default: "50"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0:        ${{ secrets.X_CT0 }}
          X_TWID:       ${{ secrets.X_TWID }}
          X_TARGET_URL: ${{ github.event.inputs.target_url }}
          X_MAX_URLS:   ${{ github.event.inputs.max_urls }}
        run: python scrape.py

      - name: Upload list.csv
        uses: actions/upload-artifact@v4
        with:
          name: x-urls
          path: list.csv
          retention-days: 14
